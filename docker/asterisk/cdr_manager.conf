; Every completed call is emitted as a CDR event over AMI.
;
; loguniqueid is what lets the platform match a CDR back to the legs it already
; heard about: without it a record carries no channel identity, so it cannot be
; attached to the hangup that opened the call and lands as a second row. With
; the id present the ingest folds every leg of a call into one row.
;
; usegmtime keeps StartTime unambiguous — a timestamp with no zone is read as
; UTC, not as whatever the container's clock is set to.
[general]
enabled = yes
use_callerid = yes
usegmtime = yes
loguniqueid = yes
