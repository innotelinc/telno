; Every completed call is emitted as a CDR event over AMI.
; The platform upserts them into the calls table, keyed on the leg's Uniqueid, so
; a reconnect or a replay can never create a duplicate row.
;
; This file is regenerated from src/telephony/provision.js on every apply, so an
; existing install picks up changes here even though /etc/asterisk is a volume.
[general]
enabled = yes
usegmtime = yes
loguniqueid = yes
